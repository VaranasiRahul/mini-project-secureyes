apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: task-manager-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # ArgoCD manages the application tier only.
          # Infrastructure (ingress-nginx, monitoring, loki, external-secrets)
          # is installed once by bootstrap-kind.sh and is not managed by ArgoCD
          # to avoid duplicate installs competing for the same host ports.
          #
          # Sync-wave annotations ON the k8s resources themselves control ordering:
          #   postgres → wave 10  (must be healthy before api connects)
          #   api + web → wave 20 (start after postgres)
          - app: apps
            path: k8s/overlays/dev
            namespace: apps
            wave: "10"

  template:
    metadata:
      name: "dev-{{app}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: task-manager
      source:
        repoURL: https://github.com/VaranasiRahul/mini-project-secureyes
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true       # remove resources deleted from Git
          selfHeal: true    # revert manual kubectl changes
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
