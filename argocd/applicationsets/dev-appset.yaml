apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: task-manager-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # ── Wave 0: networking infra + secret management ─────────────────────
          - app: ingress-nginx
            path: helm/charts/ingress-nginx
            namespace: ingress-nginx
            wave: "0"

          - app: external-secrets
            path: helm/charts/external-secrets
            namespace: external-secrets
            wave: "0"

          # ── Wave 1: monitoring stack ─────────────────────────────────────────
          - app: monitoring
            path: helm/charts/kube-prometheus-stack
            namespace: monitoring
            wave: "1"

          # ── Wave 2: log aggregation ──────────────────────────────────────────
          - app: loki
            path: helm/charts/loki-stack
            namespace: monitoring
            wave: "2"

          # ── Wave 10-20: application tier ─────────────────────────────────────
          # postgres (wave 10), api + web (wave 20) are controlled by
          # sync-wave annotations ON the individual k8s resources in k8s/base/.
          # ArgoCD deploys them in the correct order within this single app.
          - app: apps
            path: k8s/overlays/dev
            namespace: apps
            wave: "10"

  template:
    metadata:
      name: "dev-{{app}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: task-manager
      source:
        repoURL: https://github.com/VaranasiRahul/mini-project-secureyes
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true       # remove resources deleted from Git
          selfHeal: true    # revert manual kubectl changes
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
