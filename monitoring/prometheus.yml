global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # no alertmanager in compose; alerts visible in Prometheus UI

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api
    static_configs:
      - targets: [api:8000]
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: [host.docker.internal:9100]  # if node-exporter runs on host
