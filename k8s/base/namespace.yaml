apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    # baseline: blocks privileged containers, hostPID, hostNetwork, hostPath.
    # We use baseline (not restricted) because postgres initdb requires CHOWN/FOWNER
    # capabilities that restricted forbids. All other workloads conform to restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
