apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: apps
spec:
  # Empty podSelector = applies to ALL pods in the namespace.
  # This implements zero-trust: no pod can send or receive traffic
  # unless another NetworkPolicy explicitly allows it.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
