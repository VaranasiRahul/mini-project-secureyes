apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wave 20 — api + web only (postgres is wave 10, deployed separately).
# Also includes namespace, default-deny, NetworkPolicies, monitoring resources.
resources:
  - ../../../base/namespace.yaml
  - ../../../base/default-deny.yaml
  - ../../../base/api/deployment.yaml
  - ../../../base/api/service.yaml
  - ../../../base/api/networkpolicy.yaml
  - ../../../base/api/allow-prometheus-scrape.yaml
  - ../../../base/api/servicemonitor.yaml
  - ../../../base/web/deployment.yaml
  - ../../../base/web/service.yaml
  - ../../../base/web/networkpolicy.yaml
  - ../../../base/monitoring/dashboard-configmap.yaml
  - ../../../base/monitoring/prometheus-rules.yaml
  - ingress.yaml

namespace: apps

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
