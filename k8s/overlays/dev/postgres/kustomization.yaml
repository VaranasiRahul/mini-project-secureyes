apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wave 10 — postgres only.
# Deployed before api/web so the database is ready when the app starts.
resources:
  - ../../../base/postgres/deployment.yaml
  - ../../../base/postgres/service.yaml
  - ../../../base/postgres/networkpolicy.yaml

namespace: apps

secretGenerator:
  - name: postgres-secret
    envs:
      - ../secret.env   # gitignored — copy from secret.env.example
