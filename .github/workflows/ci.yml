name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check app/api/

      - name: Lint Helm — ingress-nginx
        run: |
          helm dependency update helm/charts/ingress-nginx
          helm lint helm/charts/ingress-nginx

      - name: Lint Helm — kube-prometheus-stack
        run: |
          helm dependency update helm/charts/kube-prometheus-stack
          helm lint helm/charts/kube-prometheus-stack

      - name: Lint Helm — loki-stack
        run: |
          helm dependency update helm/charts/loki-stack
          helm lint helm/charts/loki-stack

      - name: Lint Helm — external-secrets
        run: |
          helm dependency update helm/charts/external-secrets
          helm lint helm/charts/external-secrets

      - name: Create secret.env for kustomize validation
        run: |
          printf 'POSTGRES_USER=lint\nPOSTGRES_PASSWORD=lint\nDATABASE_URL=postgresql://lint:lint@postgres:5432/taskdb\n' > k8s/overlays/dev/secret.env
          cp k8s/overlays/dev/secret.env k8s/overlays/qat/secret.env

      - name: Validate Kustomize — dev
        run: kubectl kustomize k8s/overlays/dev > /dev/null

      - name: Validate Kustomize — qat
        run: kubectl kustomize k8s/overlays/qat > /dev/null

  # ── Build & Scan ─────────────────────────────────────────────────────────────
  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t task-api:${{ github.sha }} ./app/api

      - name: Build Web image
        run: docker build -t task-web:${{ github.sha }} ./app/web

      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: task-api:${{ github.sha }}
          format: table
          exit-code: "0"          # report CVEs but don't block — demo project
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Web image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: task-web:${{ github.sha }}
          format: table
          exit-code: "0"          # report CVEs but don't block — demo project
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── Deploy to Kind ────────────────────────────────────────────────────────────
  deploy-kind:
    name: Deploy to Kind
    needs: [lint, build-and-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: ci-cluster
          config: kind-config.yaml

      - name: Build and load images into Kind
        run: |
          docker build -t task-api:${{ github.sha }} ./app/api
          docker build -t task-web:${{ github.sha }} ./app/web
          kind load docker-image task-api:${{ github.sha }} --name ci-cluster
          kind load docker-image task-web:${{ github.sha }} --name ci-cluster

      - name: Create namespace and secret
        run: |
          kubectl create namespace apps --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_USER=taskuser \
            --from-literal=POSTGRES_PASSWORD=ci-test-secret \
            --from-literal=DATABASE_URL=postgresql://taskuser:ci-test-secret@postgres:5432/taskdb \
            -n apps --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Prometheus Operator CRDs
        run: |
          # The dev overlay includes ServiceMonitor and PrometheusRule resources.
          # These require the Prometheus Operator CRDs to exist on the cluster.
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.73.0/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.73.0/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

      - name: Create secret.env for kustomize
        run: |
          # kustomize secretGenerator needs secret.env to exist (it's gitignored)
          printf 'POSTGRES_USER=taskuser\nPOSTGRES_PASSWORD=ci-test-secret\nDATABASE_URL=postgresql://taskuser:ci-test-secret@postgres:5432/taskdb\n' > k8s/overlays/dev/secret.env
          cp k8s/overlays/dev/secret.env k8s/overlays/qat/secret.env

      - name: Patch image tags and apply dev overlay
        run: |
          kubectl kustomize k8s/overlays/dev \
            | sed "s|task-api:local|task-api:${{ github.sha }}|g" \
            | sed "s|task-web:local|task-web:${{ github.sha }}|g" \
            | kubectl apply -f -

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/api -n apps --timeout=120s
          kubectl rollout status deployment/web -n apps --timeout=120s

      - name: Smoke test API
        run: |
          kubectl port-forward svc/api 8000:8000 -n apps &
          sleep 5
          curl -f http://localhost:8000/healthz
