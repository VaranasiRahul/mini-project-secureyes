server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → FastAPI backend (strips /api prefix)
    # This means the React app calls /api/tasks — no cross-origin issues,
    # no VITE_API_URL needed at build time. Works in Compose and Kind.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Serve React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Docker / k8s probes
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
